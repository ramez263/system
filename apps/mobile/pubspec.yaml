name: tunnel_plus
description: "Ramez Tunnel Plus - A premium VPN & network-tunneling application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Functional Programming
  flutter_bloc: ^8.1.6
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  fpdart: ^1.1.0
  equatable: ^2.0.7

  # Dependency Injection & Routing
  get_it: ^8.0.3
  injectable: ^2.5.0
  go_router: ^14.8.1

  # Networking & HTTP
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.3

  # Local Storage & Encryption
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.2.0
  flutter_secure_storage: ^9.2.4

  # Device & Utilities
  uuid: ^4.5.1
  device_info_plus: ^11.3.0
  package_info_plus: ^8.2.1
  intl: ^0.20.2
  crypto: ^3.0.6

  # UI, Charts & Polish
  flutter_animate: ^4.5.2
  loading_animation_widget: ^1.3.0
  fl_chart: ^0.70.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  injectable_generator: ^2.7.0
  drift_dev: ^2.26.0
  mocktail: ^1.0.4
  pigeon: ^22.7.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/providers/
