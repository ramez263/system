version: '3.8'

services:
  backend:
    build:
      context: ../../apps/backend
      dockerfile: ../../infra/docker/Dockerfile.backend
    container_name: ramez_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ramez_tunnel
      DB_USERNAME: ramez_user
      DB_PASSWORD: ramez_secret_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ../../apps/backend:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - ramez_network

  reverb:
    build:
      context: ../../apps/backend
      dockerfile: ../../infra/docker/Dockerfile.backend
    container_name: ramez_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      REDIS_HOST: redis
    volumes:
      - ../../apps/backend:/var/www/html
    depends_on:
      - redis
    networks:
      - ramez_network

  mysql:
    image: mysql:8.0
    container_name: ramez_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ramez_tunnel
      MYSQL_USER: ramez_user
      MYSQL_PASSWORD: ramez_secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ramez_network

  redis:
    image: redis:7-alpine
    container_name: ramez_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ramez_network

networks:
  ramez_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
